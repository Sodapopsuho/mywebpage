<!DOCTYPE html>
<html>
<head>
<style>
  
  ul {
    list-style-type: square;
    padding-left: 20px; 
  }

  ul li {
    background-color: #e0f7fa; 
    padding: 10px;
    margin-bottom: 5px; 
    border-radius: 4px;
    font-family: sans-serif;
  }

  
  ol {
    list-style-type: upper-roman;
    padding-left: 40px;
    font-family: 'Times New Roman', serif;
    font-size: 1.1rem;
  }
  
  ol li {
      padding: 5px 0;
  }
</style>
</head>
<body>

  <h3>Unordered List (Square Bullets)</h3>
  <ul>
    <li>HTML Structure</li>
    <li>CSS Styling</li>
    <li>JavaScript Logic</li>
  </ul>

  <hr>

  <h3>Ordered List (Roman Numerals)</h3>
  <ol>
    <li>Introduction</li>
    <li>Core Concepts</li>
    <li>Advanced Techniques</li>
  </ol>

</body>
</html>
