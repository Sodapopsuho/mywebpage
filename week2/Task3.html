<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splitsvilla X6 - Fan Zone</title>
</head>
<body>

    <header>
        <h1>Splitsvilla X6: Fan Feedback</h1>
        <p>Who is your favorite contestant? Do you have an "Ideal Match" prediction? Let us know below!</p>
    </header>

    <main>
        <form action="#" method="post">
            
            <div>
                <label for="fan-name">Your Name:</label>
                <input type="text" id="fan-name" name="fan-name" required placeholder="Enter your name">
            </div>

            <br>

            <div>
                <label for="fan-email">Email Address:</label>
                <input type="email" id="fan-email" name="fan-email" required placeholder="name@example.com">
            </div>

            <br>

            <div>
                <label for="topic">What's on your mind?:</label>
                <select id="topic" name="topic">
                    <option value="ideal-match">Ideal Match Prediction</option>
                    <option value="dome-session">Dome Session Feedback</option>
                    <option value="villain-move">Villain/Hero Moves</option>
                    <option value="other">General Gossip</option>
                </select>
            </div>

            <br>

            <div>
                <label for="fan-message">Your Prediction/Message:</label><br>
                <textarea id="fan-message" name="fan-message" rows="6" cols="50" placeholder="Type your spicy takes here..."></textarea>
            </div>

            <br>

            <div>
                <button type="submit">Submit to the Villa</button>
            </div>

        </form>
    </main>

    <footer>
        <hr>
        <p>&copy; 2026 Splitsvilla X6 Fan Portal | Created by Mohd Salman Gazi</p>
    </footer>

</body>
</html>
